<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css">
    </head>
   <body>
     <header class="header">
        <h1>Registrasi</h1>
     </header>

        <div class="layout">
        <nav class="nav">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="registrasi.html">Registrasi</a></li>
           <ul>
        </nav>
     
     <main class="konten">
        <section id="home">
        <h2>Kontak</h2>
        <p>Kunjungi <a href="profile.html">Kunjungi Profile Saya</a>.</p>

        <form action="registrasi.html" method="get">
          <div class="form-group">
            <label for="nama">Nama Lengkap</label><br />
            <input class="input-form" type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" minlength="3" maxlength="50" required />
          </div>

          <div class="form-group">
            <label for="email">Email</label><br />
            <input class="input-form" type="email" id="email" name="email" placeholder="nama@email.com" required />
          </div>

          <div class="form-group">
            <label for="tanggal">Tanggal Kunjungan</label><br />
            <input class="input-form" type="date" id="tanggal" name="tanggal" required />
          </div>

          <div class="form-group">
            <label for="semester">Jumlah Kucing</label><br />
            <input class="input-form" type="number" id="semester" name="semester" min="1" max="14" required />
          </div>

          <div class="form-group">
            <p>Jenis Kelamin</p>
            <label for="pertanyaan">Jantan</label>
            <input type="radio" id="pertanyaan" name="jenis_pesan" value="pertanyaan" required />
            <label for="saran">Betina</label>
            <input type="radio" id="saran" name="jenis_pesan" value="saran" />
          </div>

          <div class="form-group">
            <p>Tujuan</p>
            <label for="minat-html">Adopsi</label>
            <input type="checkbox" id="minat-html" name="minat" value="HTML" />
            <label for="minat-css">Penitipan</label>
            <input type="checkbox" id="minat-css" name="minat" value="CSS" />
          </div>

          <div class="form-group">
           <label for="prodi">Buat Janji</label><br />
           <select class="input-form" id="prodi" name="prodi" required>
            <option value="">-- Jadwal yang Tersedia --</option>
            <option value="SI">Pagi, 09:00-12:00</option>
            <option value="TI">Sore, 13:00-17:00</option>
            <option value="BD">Malam, 18:00-21:00</option>
           </select>
          </div>

          <div class="form-group">
            <label for="pesan">Catatan untuk Kami</label><br />
            <textarea class="input-form" id="pesan" name="pesan" maxlength="300" placeholder="Tulis pesan Anda" required></textarea>
          </div>

          <button type="submit">Kirim</button>
          <button type="reset">Batal</button>
        </form>
      </section>
      </main>
      </div>


      <footer class="footer">
